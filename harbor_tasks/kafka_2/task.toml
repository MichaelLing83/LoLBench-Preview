schema_version = "1.3"

[task]
name = "lolbench/kafka_2"
description = "Implement Apache Kafka - KIP-769: Connect APIs to list all connector plugins and retrieve their configuration definitions."
authors = [{ name = "LoLBench maintainers" }]
keywords = ["lolbench", "coding-agent", "apache", "kafka", "java"]

[metadata]
instance_id = "kafka_2"
source_instance_id = "Apache-Kafka_KIP-769-Connect-APIs-to-list-all-connector-plugins-and-retri_PR-11572"
source_slug = "Apache-Kafka_KIP-769-Connect-APIs-to-list-all-connector-plugins-and-retri_PR-11572"
docker_slug = "Apache-Kafka_KIP-769-Connect-APIs-to-list-all-connector-plugins-and-retri_PR-11572"
dockerhub_image = "smartdub26/lolbench:kafka_2-1.0.0"
dockerhub_digest = "sha256:368ffd392be3be9cbeb107b42809a165b2ae8001f9abf3a244eb8da059d719ef"
project = "kafka"
repo = "apache/kafka"
requirement_doc = "https://cwiki.apache.org/confluence/display/KAFKA/KIP-769"
pr_link = "https://github.com/apache/kafka/pull/11572"
base_commit = "066cdc8c621dfc4d26e12ee539368d6c1eb2707f"
merge_commit = "1913e7102db6a671bd96627928ce9faabe6bcdc9"
test_level = "system"
source_history_policy = "ancestors-only"
lolbench_test_modes = ["orig", "aug", "union"]
default_lolbench_suite = "union"
canonical_lolbench_suite = "union"
augmentation_available = true
verifier_network_policy = "public"
verifier_network_reason = "The Harbor verifier runs in a separate container and may use network access; migrated LoLBench verifier assets are mounted only in the verifier phase."

[environment]
build_timeout_sec = 3600.0
docker_image = "smartdub26/lolbench:kafka_2-1.0.0"
network_mode = "public"
os = "linux"
cpus = 4
memory_mb = 8192
storage_mb = 20480

[agent]
timeout_sec = 21600.0
user = "agent"
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai", "api.openai.com", "api.anthropic.com"]

[verifier]
timeout_sec = 5400.0
user = "root"
environment_mode = "separate"
network_mode = "public"

[verifier.env]
LOLBENCH_SUITE = "union"

[verifier.environment]
docker_image = "smartdub26/lolbench:kafka_2-1.0.0"
network_mode = "public"
os = "linux"
cpus = 4
memory_mb = 8192
storage_mb = 20480
