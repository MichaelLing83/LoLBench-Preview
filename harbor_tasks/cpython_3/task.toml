schema_version = "1.3"

[task]
name = "lolbench/cpython_3"
description = "Implement CPython - PEP 634: Structural Pattern Matching: Specification."
authors = [{ name = "LoLBench maintainers" }]
keywords = ["lolbench", "coding-agent", "cpython", "c", "python"]

[metadata]
instance_id = "cpython_3"
source_instance_id = "CPython_PEP-634_Structural-Pattern-Matching_PR-22917"
source_slug = "CPython_PEP-634_Structural-Pattern-Matching_PR-22917"
docker_slug = "CPython_PEP-634_Structural-Pattern-Matching_PR-22917"
dockerhub_image = "smartdub26/lolbench:cpython_3-1.0.0"
dockerhub_digest = "sha256:63e2060720002cf844c6c8d0f5a78193295deb6c1dd8b636f4a26db9889ecea8"
project = "cpython"
repo = "python/cpython"
requirement_doc = "https://peps.python.org/pep-0634/"
