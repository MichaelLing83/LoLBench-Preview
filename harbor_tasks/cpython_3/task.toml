base_commit = "cc02b4f2e810ab524d845daa18bc94df5b092dd8"
merge_commit = "145bf269df3530176f6ebeab1324890ef7070bf8"
test_level = "system"
source_history_policy = "ancestors-only"
lolbench_test_modes = ["orig", "aug", "union"]
default_lolbench_suite = "union"
canonical_lolbench_suite = "union"
augmentation_available = true
verifier_network_policy = "public"
verifier_network_reason = "The Harbor verifier runs in a separate container and may use network access; migrated LoLBench verifier assets are mounted only in the verifier phase."

[environment]
build_timeout_sec = 3600.0
docker_image = "smartdub26/lolbench:cpython_3-1.0.0"
network_mode = "public"
os = "linux"
cpus = 4
memory_mb = 7168
storage_mb = 20480

[agent]
timeout_sec = 21600.0
user = "agent"
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai", "api.openai.com", "api.anthropic.com"]

[verifier]
timeout_sec = 5400.0
user = "root"
environment_mode = "separate"
network_mode = "public"

[verifier.env]
LOLBENCH_SUITE = "union"

[verifier.environment]
docker_image = "smartdub26/lolbench:cpython_3-1.0.0"
network_mode = "public"
os = "linux"
cpus = 4
memory_mb = 7168
storage_mb = 20480
